<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | Gestión de Turnos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <h1>Elegí una contraseña nueva</h1>
            <form id="formRestablecer">
                <label for="password">Nueva contraseña</label>
                <input id="password" type="password" minlength="8" required>
                <label for="confirmacion">Repetir contraseña</label>
                <input id="confirmacion" type="password" minlength="8" required>
                <button type="submit">Guardar contraseña</button>
            </form>
            <p id="mensaje" class="mensaje" role="status"></p>
            <p class="ayuda"><a href="index.html">Ir al inicio de sesión</a></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/restablecer.js"></script>
</body>
</html>
