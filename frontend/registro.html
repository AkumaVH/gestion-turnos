<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Gestión de Turnos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta ancha">
            <h1>Crear cuenta</h1>
            <p>El paciente puede darse de alta. El médico tiene que existir ya en el centro.</p>

            <form id="formRegistro">
                <label for="tipo">Tipo de cuenta</label>
                <select id="tipo" name="tipo">
                    <option value="paciente">Paciente</option>
                    <option value="medico">Médico</option>
                </select>

                <div id="datosPaciente">
                    <label for="dni">DNI</label>
                    <input id="dni" name="dni" inputmode="numeric" required>

                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" required>

                    <label for="apellido">Apellido</label>
                    <input id="apellido" name="apellido" required>

                    <label for="nacimiento">Fecha de nacimiento</label>
                    <input id="nacimiento" name="nacimiento" type="date" required>
                </div>

                <div id="datosMedico" hidden>
                    <label for="matricula">Matrícula</label>
                    <input id="matricula" name="matricula" inputmode="numeric">
                </div>

                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" required>

                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" minlength="8" required>

                <button type="submit">Registrarme</button>
            </form>

            <p id="mensaje" class="mensaje" role="status"></p>
            <p class="ayuda"><a href="index.html">Volver al inicio de sesión</a></p>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
